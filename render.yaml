services:
  - type: web
    name: smarttimetable-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_OFFICER_ID
        value: "17301"
      - key: BOOTSTRAP_OFFICER_TEMP_PASSWORD
        value: "8296060284"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

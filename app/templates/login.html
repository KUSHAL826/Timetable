<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SmartTimetable AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 flex flex-col justify-center items-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden" x-data="{ mustChangePwd: {{ 'true' if must_change_password else 'false' }} }">
    <!-- Header Banner -->
    <div class="bg-slate-900 p-8 text-center text-white relative">
      <div class="h-14 w-14 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/30">
        <i data-lucide="shield" class="h-7 w-7 text-white"></i>
      </div>
      <h2 class="text-xl font-bold tracking-tight">SmartTimetable AI</h2>
      <p class="text-xs text-slate-400 mt-1">Institutional Scheduling & Optimization Platform</p>
    </div>

    <!-- Login Body -->
    <div class="p-8">
      {% if error %}
      <div class="mb-6 p-3.5 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs flex items-start gap-2.5">
        <i data-lucide="alert-circle" class="h-4 w-4 shrink-0 mt-0.5"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      {% if success_msg %}
      <div class="mb-6 p-3.5 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-700 text-xs flex items-start gap-2.5">
        <i data-lucide="check-circle" class="h-4 w-4 shrink-0 mt-0.5"></i>
        <span>{{ success_msg }}</span>
      </div>
      {% endif %}

      <template x-if="!mustChangePwd">
        <form method="POST" action="/login" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
              Teacher ID / Officer ID
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="user" class="h-4 w-4"></i>
              </div>
              <input
                type="text"
                name="employee_id"
                required
                placeholder="e.g. 17301 or T101"
                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all font-mono"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
              Password
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="key-round" class="h-4 w-4"></i>
              </div>
              <input
                type="password"
                name="password"
                required
                placeholder="Enter password"
                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all"
              />
            </div>
            <p class="text-[11px] text-slate-400 mt-1">
              Teachers: initial password is your registered phone number.
            </p>
          </div>

          <button
            type="submit"
            class="w-full mt-2 py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2"
          >
            <span>Sign In</span>
            <i data-lucide="arrow-right" class="h-4 w-4"></i>
          </button>

          <!-- Bootstrap Hint Card -->
          <div class="mt-6 p-3.5 rounded-lg bg-slate-50 border border-slate-200 text-[11px] text-slate-600 space-y-1">
            <p class="font-bold text-slate-800">Initial Officer Provisioning:</p>
            <p>• Officer ID: <span class="font-mono text-blue-600 font-bold">17301</span></p>
            <p>• Initial Password: <span class="font-mono text-blue-600 font-bold">8296060284</span></p>
            <p class="text-slate-400 text-[10px] mt-1 pt-1 border-t border-slate-200">
              Teachers are added dynamically by the Officer in the Faculty Management screen.
            </p>
          </div>
        </form>
      </template>

      <!-- Forced Password Change Form -->
      <template x-if="mustChangePwd">
        <form method="POST" action="/change-password-first" class="space-y-4">
          <input type="hidden" name="employee_id" value="{{ temp_employee_id }}">
          <input type="hidden" name="old_password" value="{{ temp_old_password }}">

          <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg text-amber-900 text-xs leading-relaxed">
            <strong>Mandatory Security Step:</strong> You are logging in with a temporary initial credential. You must set a permanent secure password to continue.
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">New Secure Password</label>
            <input
              type="password"
              name="new_password"
              required
              minlength="8"
              placeholder="Minimum 8 characters"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password</label>
            <input
              type="password"
              name="confirm_password"
              required
              minlength="8"
              placeholder="Re-type new password"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white"
            />
          </div>

          <button
            type="submit"
            class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg shadow-md transition-all"
          >
            Save Password & Proceed to System
          </button>
        </form>
      </template>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
